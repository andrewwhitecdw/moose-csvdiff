[package]
name = "moose-csvdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Byte-compatible Rust port of MOOSE's csvdiff CSV comparison tool"
license = "MIT"
repository = "https://github.com/andrewwhitecdw/moose-csvdiff"
keywords = ["moose", "csv", "diff", "testing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
